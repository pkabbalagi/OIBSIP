<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TempX | Temperature Converter</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div class="background-circle circle-one"></div>
    <div class="background-circle circle-two"></div>

    <main class="container">

        <div class="converter-card">

            <header class="header">

                <div class="icon">
                    🌡️
                </div>

                <p class="eyebrow">
                    SMART TEMPERATURE TOOL
                </p>

                <h1>
                    Temperature
                    <span>Converter</span>
                </h1>

                <p class="description">
                    Convert temperatures instantly between
                    Celsius, Fahrenheit and Kelvin.
                </p>

            </header>


            <section class="converter">

                <div class="input-group">

                    <label for="temperature">
                        Enter Temperature
                    </label>

                    <input
                        type="number"
                        id="temperature"
                        placeholder="Enter temperature value"
                        step="any"
                    >

                </div>


                <div class="input-group">

                    <label for="unit">
                        Select Input Unit
                    </label>

                    <select id="unit">

                        <option value="celsius">
                            Celsius (°C)
                        </option>

                        <option value="fahrenheit">
                            Fahrenheit (°F)
                        </option>

                        <option value="kelvin">
                            Kelvin (K)
                        </option>

                    </select>

                </div>


                <button id="convertBtn">

                    Convert Temperature

                    <span>→</span>

                </button>


                <p id="errorMessage" class="error"></p>

            </section>


            <section class="results">

                <h2>
                    Conversion Results
                </h2>


                <div class="result-grid">


                    <div class="result-card">

                        <div class="unit-icon">
                            °C
                        </div>

                        <div>

                            <p>
                                Celsius
                            </p>

                            <h3 id="celsiusResult">
                                --
                            </h3>

                        </div>

                    </div>


                    <div class="result-card">

                        <div class="unit-icon">
                            °F
                        </div>

                        <div>

                            <p>
                                Fahrenheit
                            </p>

                            <h3 id="fahrenheitResult">
                                --
                            </h3>

                        </div>

                    </div>


                    <div class="result-card">

                        <div class="unit-icon">
                            K
                        </div>

                        <div>

                            <p>
                                Kelvin
                            </p>

                            <h3 id="kelvinResult">
                                --
                            </h3>

                        </div>

                    </div>


                </div>

            </section>



        </div>

    </main>


    <script src="script.js"></script>

</body>
</html>
